<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#162e55"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield Rounded Rect with Navy Blue -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bankGrad)" stroke="#1e3a66" stroke-width="2"/>

  <!-- Bank Landmark Building Icon in White -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Roof Triangle (Pediment) -->
    <path d="M 32 14 L 14 24 L 50 24 Z"/>
    
    <!-- Architrave Beam below Pediment -->
    <rect x="15" y="25" width="34" height="3" rx="1"/>
    
    <!-- 4 Classical Bank Pillars / Columns -->
    <rect x="17" y="30" width="4.5" height="15" rx="1"/>
    <rect x="25" y="30" width="4.5" height="15" rx="1"/>
    <rect x="34.5" y="30" width="4.5" height="15" rx="1"/>
    <rect x="42.5" y="30" width="4.5" height="15" rx="1"/>
    
    <!-- Podium / Stylobate Steps -->
    <rect x="14" y="46" width="36" height="3" rx="1"/>
    <rect x="12" y="50" width="40" height="3" rx="1"/>
  </g>

  <!-- Patriotic Red Security Seal / Badge Accent in Bottom-Right Corner -->
  <circle cx="49" cy="49" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <path d="M 46 49 L 48.5 51.5 L 52.5 47" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
